# ===================================================================
# 정기적으로 dev를 검사한 뒤 통과하면 main에 자동 병합
#  - 한국시간 00/06/12/18시에 실행 (cron은 UTC라 변환해서 기재)
#  - 반드시 기본 브랜치(main)에 있어야 cron이 작동함
# ===================================================================

name: CI-CD Main (Scheduled Dev to Main)

on:
  schedule:
    - cron: '0 3,9,15,21 * * *'   # KST 00/06/12/18시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build & Test (dev)
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Merge dev into main
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge dev --no-ff -m "chore: 정기 병합 dev → main (CI 통과)"
          git push origin main
          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      # --- D: 실제 병합이 일어났을 때만 성공 알림 ---
      - name: Notify success (Discord)
        if: success() && steps.merge.outputs.merged == 'true'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"✅ [main] 정기 병합 성공 — dev 변경이 main에 반영되었습니다.\n${{ github.server_url }}/${{ github.repository }}/commits/main"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"

      # --- B: 검사 또는 병합 실패 시 알림 ---
      - name: Notify failure (Discord)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"❌ [main] 정기 dev→main 검사/병합 실패 — 확인 필요:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"