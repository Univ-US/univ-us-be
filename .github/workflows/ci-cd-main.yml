# ===================================================================
# CI-CD Main: 정기적으로 dev를 검사한 뒤 통과하면 main에 자동 병합
#  - ⛔ [임시 정지] CD 안정화 전까지 스케줄(cron) 자동 병합 중단.
#        → 현재는 수동(workflow_dispatch) 실행만 동작.
#        → 복구: 아래 schedule 2줄 주석 해제 후 반드시 'dev'(기본 브랜치)에 반영.
#  - ⚠️ 스케줄 워크플로우라 반드시 기본 브랜치(현재 dev)에 있어야 작동함
# ===================================================================

name: CI-CD Main (Scheduled Dev to Main)

on:
  # schedule:
  #   - cron: '0 21 * * *'   # KST 06시 (UTC 21:00 = KST 06:00)  ← [임시 정지]
  workflow_dispatch:        # 수동 실행 버튼 (정지 중에도 수동 병합은 가능)

permissions:
  contents: write           # main에 push(병합) 권한

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dev)       # dev 브랜치를 받아옴 (검사 대상이 dev)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0           # 병합하려면 전체 히스토리 필요
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build & Test (dev)   # dev 코드 빌드+테스트 (실패 시 중단)
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Merge dev into main  # 검사 통과 시 dev를 main에 병합
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge dev --no-ff -m "chore: 정기 병합 dev → main (CI 통과)"
          git push origin main
          AFTER=$(git rev-parse HEAD)
          # 해시가 바뀌었으면 실제 병합됨 → merged=true
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      # --- D: 실제 병합이 일어났을 때만 성공 알림 ---
      - name: Notify success (Discord)
        if: success() && steps.merge.outputs.merged == 'true'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"✅ [main] 정기 병합 성공 — dev 변경이 main에 반영되었습니다."}' \
            "${{ secrets.DISCORD_WEBHOOK }}"

      # --- B: 검사 또는 병합 실패 시 알림 ---
      - name: Notify failure (Discord)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"❌ [main] 정기 dev→main 검사/병합 실패 — 확인 필요:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"