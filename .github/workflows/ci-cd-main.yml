# ===================================================================
# 정기적으로 dev를 검사한 뒤 통과하면 main에 자동 병합
#  - 한국시간 00/06/12/18시에 실행 (cron은 UTC라 변환해서 기재)
#  - 반드시 기본 브랜치(main)에 있어야 cron이 작동함
# ===================================================================

name: CI-CD Main (Scheduled Dev to Main)

on:
  schedule:
    # KST 00/06/12/18시 = UTC 15/21/03/09시
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (dev 기준, 전체 히스토리)
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build & Test (dev 코드 검사)
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Merge dev into main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge dev --no-ff -m "chore: 정기 병합 dev → main (CI 통과)"
          git push origin main