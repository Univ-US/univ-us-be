# ===================================================================
# CI/CD 파이프라인: feat/** → dev 자동 테스트 & 병합
#  - feat 브랜치에서 dev로 PR을 올리면 자동으로 빌드/테스트 실행
#  - 통과하면 dev 브랜치로 자동 병합
# ===================================================================

name: CI-CD Pipeline          # GitHub Actions 화면에 표시될 워크플로우 이름

# --- 언제 실행할지(트리거) ---
on:
  pull_request:               # "PR이 생길 때"만 실행 (push 만으로는 실행 안 됨)
    types: [opened, synchronize, reopened]
    # opened: PR 새로 생성 / synchronize: PR에 새 커밋 추가 / reopened: 닫았다 다시 열기
    branches:
      - dev                   # 'dev'를 목적지(base)로 하는 PR만 대상

# --- 이 워크플로우가 가질 권한 ---
permissions:
  contents: write             # 코드 병합(push) 권한
  pull-requests: write        # PR 조작(병합 등) 권한

jobs:
  # ========== JOB 1: 빌드 & 테스트 ==========
  test:
    runs-on: ubuntu-latest    # GitHub이 제공하는 우분투 가상머신에서 실행
    if: startsWith(github.head_ref, 'feat/')   # PR을 보낸 브랜치가 feat/* 일 때만 실행

    steps:
      - name: Checkout        # 1) 저장소 코드를 가상머신으로 내려받기
        uses: actions/checkout@v4

      - name: Set up JDK 21   # 2) Java 21 설치 (이 프로젝트가 Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'   # Eclipse Temurin JDK 배포판
          cache: gradle             # Gradle 의존성 캐싱(빌드 속도 향상)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew       # 3) 리눅스에서 gradlew 실행 권한 부여

      - name: Build & Test
        run: ./gradlew build        # 4) 빌드 + 테스트 실행 (실패하면 여기서 중단)

  # ========== JOB 2: 자동 병합 ==========
  auto-merge:
    needs: test               # test 잡이 "성공해야만" 이 잡이 실행됨 (실패 시 병합 안 함)
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh CLI 인증용 토큰(자동 제공)
        run: |
          # 현재 PR을 dev에 병합 (--merge: 일반 머지 커밋 방식)
          gh pr merge ${{ github.event.pull_request.number }} \
            --merge \
            --repo ${{ github.repository }}