# ===================================================================
# CI/CD 파이프라인: feat/** → dev 자동 테스트 & 병합 (+ Discord 알림)
#  - feat 브랜치에서 dev로 PR을 올리면 자동 빌드/테스트
#  - 통과 시 dev로 자동 병합 / 실패 시 Discord 알림
# ===================================================================

name: CI-CD Pipeline          # Actions 화면에 표시되는 워크플로우 이름

# --- 언제 실행할지(트리거) ---
on:
  pull_request:               # "PR이 생길 때"만 실행 (push만으론 실행 안 됨)
    types: [opened, synchronize, reopened]
    # opened: PR 새로 생성 / synchronize: PR에 새 커밋 추가 / reopened: 닫았다 다시 열기
    branches:
      - dev                   # 목적지(base)가 'dev'인 PR만 대상

# --- 이 워크플로우가 가질 권한 (read-only 잠금이어도 여기서 끌어올림) ---
permissions:
  contents: write             # dev에 병합(push)하는 권한
  pull-requests: write        # PR 조작(병합) 권한

# --- 동시 실행 제어: 동시 PR을 한 번에 하나씩 처리(직렬화) ---
concurrency:
  group: merge-to-dev         # 모든 PR이 같은 그룹 → 동시에 안 돌고 줄 섬
  cancel-in-progress: false   # 진행 중인 건 취소 말고 '대기'시킴

jobs:
  # ========== JOB 1: 빌드 & 테스트 ==========
  test:
    runs-on: ubuntu-latest    # GitHub 제공 우분투 가상머신에서 실행
    if: startsWith(github.head_ref, 'feat/')   # PR 보낸 브랜치가 feat/* 일 때만 실행

    steps:
      - name: Checkout        # 1) 저장소 코드를 가상머신으로 내려받기
        uses: actions/checkout@v4

      - name: Set up JDK 21   # 2) Java 21 설치 (이 프로젝트 버전)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'   # Eclipse Temurin JDK
          cache: gradle             # Gradle 의존성 캐싱(빌드 속도 ↑)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew       # 3) 리눅스에서 gradlew 실행 권한 부여

      - name: Build & Test
        run: ./gradlew build        # 4) 빌드+테스트 (실패하면 여기서 중단)

      # --- A: 위 단계 중 실패가 있으면 Discord로 '테스트 실패' 알림 ---
      - name: Notify test failure (Discord)
        if: failure()               # 같은 job에서 앞 단계가 하나라도 실패했을 때만 실행
        run: |
          # secrets.DISCORD_WEBHOOK = 미리 등록한 Discord 웹훅 URL
          # ${{ }} 값들은 GitHub이 실행 시 자동으로 채움 (직접 입력 X)
          curl -H "Content-Type: application/json" \
            -d '{"content":"❌ [dev] PR #${{ github.event.pull_request.number }} 테스트 실패로 병합이 거부되었습니다.\n로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"

  # ========== JOB 2: 자동 병합 ==========
  auto-merge:
    needs: test                 # test 잡이 '성공'해야만 이 잡 실행 (실패 시 건너뜀)
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh CLI 인증용 토큰(자동 제공)
        run: |
          # 현재 PR을 dev에 병합 (--merge: 일반 머지 커밋 방식)
          gh pr merge ${{ github.event.pull_request.number }} \
            --merge \
            --repo ${{ github.repository }}

      # --- C: 테스트는 통과했으나 병합 단계가 실패하면 알림 (조용한 실패 방지) ---
      - name: Notify merge failure (Discord)
        if: failure()               # 위 병합 단계가 실패(충돌/권한 등)했을 때만 실행
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"⚠️ [dev] PR #${{ github.event.pull_request.number }} 은 테스트는 통과했으나 자동 병합에 실패했습니다(충돌/권한 등). 수동 확인 필요:\n${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"}' \
            "${{ secrets.DISCORD_WEBHOOK }}"