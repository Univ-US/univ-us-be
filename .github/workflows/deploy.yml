# =====================================================================
# deploy.yml — 백엔드 CD 파이프라인 (GitHub Actions)
#
# [무엇] main push(또는 수동 실행) 시: 빌드 → 이미지 → GHCR → helm 배포.
# [왜]   'main 머지 = 자동 배포'를 구현하는 핵심. (기존 ci-cd-*.yml 은 안 건드림)
# [구조] build 잡(GitHub 클라우드): JAR/이미지 빌드 후 GHCR push
#        deploy 잡(우리 VM 러너): helm upgrade 로 K8s 롤아웃
# =====================================================================
name: Deploy BE (build → GHCR → helm)

on:
  workflow_dispatch:            # 수동 실행(첫 배포·테스트용)
  push:
    branches: [main]            # 실제 CD: main 머지 시
  # ⚠️ pull_request 트리거 금지 (public 레포 + self-hosted = fork RCE 방지)

permissions:
  contents: read
  packages: write               # GHCR push 권한

env:
  IMAGE: ghcr.io/univ-us/univ-us-be

jobs:
  build:                        # GitHub-hosted 에서 빌드·푸시
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Build JAR
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test
          cp build/libs/univus-0.0.1-SNAPSHOT.jar app.jar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:                       # self-hosted(VM) 에서 배포
    needs: build
    runs-on: [self-hosted, univus-vm]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: helm upgrade
        run: |
          helm upgrade --install univ-us-be ./charts/univ-us-be \
            --set image.tag=${{ github.sha }} \
            -n univus --wait --timeout 5m

  # ===================================================================
  # 잡 3) notify — 배포 결과(성공/실패)를 Discord 로 알림
  #   [무엇] build·deploy 두 잡이 끝난 뒤, 그 결과를 Discord 웹훅으로 통지.
  #   [왜]   '배포가 됐는지/실패했는지'를 채널에서 바로 알기 위함(조용한 실패 방지).
  #   [핵심] needs:[build,deploy] + if:always() → 앞 잡이 실패/취소/스킵돼도 항상 실행.
  #          (build 실패 시 deploy 는 skipped 되는데 그 경우도 '실패'로 알려야 하므로,
  #           deploy 잡 안에 if:failure() 만 두면 빌드 실패를 놓침 → 별도 잡으로 분리)
  #   [러너] curl 한 번이라 GitHub-hosted(ubuntu-latest)에서 실행 → VM 러너 부담 X.
  #   [시크릿] secrets.DISCORD_SERVER_WEBHOOK (org-level, #server 채널 전용 — CI의 repo-level DISCORD_WEBHOOK[#Git-be]과 분리)
  # ===================================================================
  notify:
    needs: [build, deploy]
    if: always()                # 성공/실패/취소 무관하게 항상 실행
    runs-on: ubuntu-latest
    steps:
      # --- 성공: build·deploy 둘 다 success 일 때만 ---
      - name: Notify deploy success (Discord)
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"✅ [BE 배포] 배포 완료 — helm 롤아웃 성공 (univ-us-be, ns univus).\n커밋: `${{ github.sha }}` / 트리거: ${{ github.event_name }} (${{ github.ref_name }})"}' \
            "${{ secrets.DISCORD_SERVER_WEBHOOK }}"

      # --- 실패: build·deploy 중 하나라도 success 가 아닐 때(실패/취소/스킵 포함) ---
      - name: Notify deploy failure (Discord)
        if: needs.build.result != 'success' || needs.deploy.result != 'success'
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"❌ [BE 배포] 배포 실패 — build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }}.\n커밋: `${{ github.sha }}` / 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.DISCORD_SERVER_WEBHOOK }}"