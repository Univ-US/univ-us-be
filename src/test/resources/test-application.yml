# === 테스트(CI) 전용 최소 설정: 컨텍스트 로드 통과용 ===

file:
  upload-root: build/test-uploads

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

# 👇 여기에 @Value("${...}")로 찾는 모든 변수를 더미 값으로 몽땅 채워넣어야 해!
jwt:
  secret: dummy-secret-key-for-test-dummy-dummy-univ-us # JWT 최소 길이 방지용 길게!

spring:
  data:
    redis:
      host: localhost
      port: 6379

# 만약 @Value("${custom.api.key}") 같은 게 있다면 추가!
custom:
  api:
    key: dummy-key