# =============================================================================
# application-test.yml — 테스트(CI) 전용 설정
# =============================================================================
# [전략] "부팅 시 깨질 만한 외부 의존성을 테스트에선 가짜/더미로 대체"
#   - DB/MyBatis → 진짜 Oracle 대신 H2 인메모리 (Mapper 빈이 정상 생성됨)
#   - JWT        → 더미 시크릿 (⚠️ 실제 코드가 읽는 키 이름과 일치시킬 것)
#   - 파일 경로  → 더미 경로
#   ※ 여기 값은 전부 가짜/공개값 → 시크릿 아님, 커밋 OK. 진짜 정보는 application.yml(gitignore).
#   ※ 'test' 프로파일이 켜져야 로드됨 (CI: SPRING_PROFILES_ACTIVE=test).
#     → 로컬·ci-cd-main에서도 통과하려면 테스트 클래스에 @ActiveProfiles("test") 권장.
# =============================================================================

spring:
  # --- 가짜 인메모리 DB(H2): DataSource + MyBatis 가 정상 조립되게 함 ---
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle   # 메모리 DB, Oracle 호환 모드
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# --- MyBatis 매퍼 XML 위치 (메인과 동일 경로) ---
mybatis:
  mapper-locations: classpath:mybatis/mapper/**/*.xml

# --- 파일 업로드 더미 경로 (${file.upload-root} 플레이스홀더 충족) ---
file:
  upload-root: build/test-uploads

# --- JWT 더미(도입 확정): ⚠️ 실제 SecurityConfig/JwtProvider가 읽는 키와 "정확히 일치"시킬 것 ---
jwt:
  secret: test-only-dummy-jwt-secret-change-me-0123456789abcdef0123456789abcdef   # HS256용 ≥256bit(32자+)
  access-token-validity-ms: 3600000        # 1시간   (키 이름은 실제 구현에 맞춰 조정)
  refresh-token-validity-ms: 1209600000    # 14일

# =============================================================================
# [앞으로 기능 붙을 때 여기에 더미 추가]
#   - OAuth2 로그인: spring.security.oauth2.client.registration.* 더미 등록
#                    또는 OAuth2ClientAutoConfiguration 제외
#   - Redis/캐시/메일/외부 API: 더미 설정 or 해당 AutoConfig 제외
#   - 새 @Value("${x}") 프로퍼티: 여기 더미값 추가 (또는 코드에서 ${x:기본값})
# =============================================================================