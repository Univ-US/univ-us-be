# =====================================================================
# application-prod.yml — 운영(prod) 프로파일 설정 (커밋용 · 비밀 없음)
# SPRING_PROFILES_ACTIVE=prod 일 때 로드. 비밀/환경별 값은 ${ENV:기본값}
# placeholder → 운영에선 K8s ConfigMap/Secret 의 env 가 채움.
# ⚠️ gitignore 금지: application.yml 이 gitignore 라 이 파일이 JAR 에 포함되는 운영 설정 정본.
# =====================================================================
server:
  port: 9090
  tomcat:
    max-part-count: 100
    relaxed-path-chars: "[,]"
    relaxed-query-chars: "[,]"

spring:
  datasource:                                  # Oracle DataSource (HikariCP)
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    hikari:
      username: ${SPRING_DATASOURCE_USERNAME:univus}
      password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mvc:
    view: { prefix: /WEB-INF/views/, suffix: .jsp }
  servlet:
    # 업로드 용량 한도 (단일 파일·요청 합계)
    multipart: { max-file-size: 5GB, max-request-size: 5GB }
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:}
            redirect-uri: "{baseUrl}/oauth/{registrationId}/callback"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope: [profile_nickname, profile_image, account_email, name, birthday, birthyear]
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    hibernate: { ddl-auto: none }
    properties:
      hibernate: { '[show_sql]': true, '[format_sql]': true, '[use_sql_comments]': true }

mybatis:
  mapper-locations: classpath*:/mybatis/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    jdbc-type-for-null: VARCHAR

file:
  upload-root: ${FILE_UPLOAD_ROOT:/data/uploads}

# 인증 쿠키 속성 — Secure/SameSite (운영 HTTPS 기본값 true/Lax, K8s env 오버라이드 가능).
auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

# 영속 로그 — 콘솔(stdout) 유지 + 롤링 파일을 PVC(/data/logs)에 기록 (prod 프로파일만).
logging:
  file:
    name: ${LOG_PATH:/data/logs}/univ-us-be.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:/data/logs}/univ-us-be.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 2GB

# AI RAG 벡터 검색 (pgvector + Ollama 임베딩). 값은 K8s ConfigMap/Secret 주입.
pgvector:
  datasource:
    url: ${PGVECTOR_URL:}
    username: ${PGVECTOR_USERNAME:}
    password: ${PGVECTOR_PASSWORD:}
ollama:
  base-url: ${OLLAMA_BASE_URL:}
  embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

univus:
  api:
    kto-base-url: ${KTO_BASE_URL:}
    kto-service-key: ${KTO_SERVICE_KEY:}
    kakao-map-api-key: ${KAKAO_MAP_API_KEY:}
    kakao-rest-api-key: ${KAKAO_REST_API_KEY:}
    google-gemini-api-key: ${GEMINI_API_KEY:}
    kma-service-key: ${KMA_SERVICE_KEY:}
    kma-base-url: ${KMA_BASE_URL:}
    kma-mid-base-url: ${KMA_MID_BASE_URL:}
    groq-api-key: ${GROQ_API_KEY:}
    openweather-api-key: ${OPENWEATHER_API_KEY:}

portone:
  trade:
    store-id: ${PORTONE_TRADE_STORE_ID:}
    kg-inicis-channel-key: ${PORTONE_TRADE_KG_INICIS_CHANNEL_KEY:}
    kakao-pay-channel-key: ${PORTONE_TRADE_KAKAO_PAY_CHANNEL_KEY:}
    api-secret: ${PORTONE_TRADE_API_SECRET:}
  # v2 구독 결제 (PortOne)
  subscription:
    api-secret: ${PORTONE_SUBSCRIPTION_API_SECRET:}
    store-id: ${PORTONE_SUBSCRIPTION_STORE_ID:}
    card-billing-channel-key: ${PORTONE_SUBSCRIPTION_CARD_BILLING_CHANNEL_KEY:}
    kakao-billing-channel-key: ${PORTONE_SUBSCRIPTION_KAKAO_BILLING_CHANNEL_KEY:}

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-min-32-bytes-0000000000}
  access-token-validity-ms: 3600000
  refresh-token-validity-ms: 604800000

# 옥토모 인증 (아이디/비밀번호 찾기 SMS 인증 API). 값은 K8s Secret 주입.
octomo:
  api-key: ${OCTOMO_API_KEY:}
