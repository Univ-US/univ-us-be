# =====================================================================
# values.yaml — 차트 기본 설정값(템플릿에 꽂히는 변수 모음)
#
# [무엇] 이미지 주소·포트·라우팅·참조할 ConfigMap/Secret/PVC 이름 등.
# [왜]   templates/*.yaml 이 {{ .Values.xxx }} 로 이 값을 가져다 씀
#        → 값만 바꾸면 배포 동작이 바뀜(코드 수정 없이).
# [주의] image.tag 는 배포 시 helm --set 으로 커밋SHA 로 덮어씀.
# =====================================================================

# 파드(레플리카) 개수. 1 = 단일 인스턴스(인메모리 SimpleBroker로 충분, 스케일 시만 Redis/RabbitMQ).
replicaCount: 1

# 실행할 컨테이너 이미지
image:
  repository: ghcr.io/univ-us/univ-us-be   # GHCR 의 BE 이미지 경로
  tag: latest                              # 기본 태그(배포 시 --set image.tag=<커밋SHA> 로 덮어씀)
  pullPolicy: IfNotPresent                 # 같은 태그가 노드에 있으면 다시 안 받음
imagePullSecret: ghcr-cred                 # GHCR private 이미지 pull 용 인증 Secret(ns univus)

containerPort: 9090   # 컨테이너(Spring Boot)가 리슨하는 포트
service:
  port: 9090          # Service 가 노출하는 포트(IngressRoute 가 이 포트로 트래픽을 보냄)

# ── 라우팅(Traefik IngressRoute) 설정 ───────────────────────────────
# Traefik 게이트웨이가 "어떤 경로"를 이 BE 로 보낼지 정의.
ingress:
  entryPoint: web     # Traefik 진입점(web = HTTP). TLS 없음.
  # 이 BE 가 받을 경로 목록. 단수 문자열이 아니라 '리스트'라서 여러 경로를 한 번에 라우팅.
  #   /api       = REST API
  #   /ws-univus = WebSocket(STOMP/SockJS) 핸드셰이크
  #   /uploads   = 업로드 정적 파일(LMS 프로필 이미지 등) — <img> 가 직접 GET (FE 아닌 BE 가 서빙)
  # 모두 같은 BE 파드(9090)로. (templates/ingressroute.yaml 이 이 리스트를 range 로 순회)
  pathPrefixes:
    - /api
    - /ws-univus
    - /uploads

  # ── TLS(HTTPS·443) 라우팅 — 듀얼 도메인(SNI 분리) ─────────────────────
  # 위 entryPoint(web/80, 평문)은 유지하고, 443(websecure)용 TLS 라우트를 추가 생성.
  # 🔴 HTTP→HTTPS 301·HSTS 금지(www 자체서명이라 경고통과가 막혀 사이트 잠김) → 평문/TLS 공존.
  #   selfSigned : www.univus.com·univus.com → 자체서명 Secret(univus-tls), LAN 데모
  #   letsEncrypt: univus.duckdns.org        → Traefik ACME certResolver `le`(prod), webhook·외부
  # (Secret `univus-tls`·certResolver `le`·websecure NodePort = Traefik helm 에 박힌 '차트 밖' 선행조건)
  tls:
    enabled: true
    entryPoint: websecure          # 443(TLS) 진입점(Traefik ports.websecure NodePort 30724)
    selfSigned:
      enabled: true
      secretName: univus-tls       # kubernetes.io/tls Secret(ns univus, 수동 선생성, SAN www·univus.com)
      hosts:
        - www.univus.com
        - univus.com
    letsEncrypt:
      enabled: true
      certResolver: le             # Traefik certificatesResolvers.le (Let's Encrypt prod)
      hosts:
        - univus.duckdns.org

# 앱 설정·비밀 주입 — 미리 만들어 둔 ConfigMap/Secret 이름(deployment 가 envFrom 으로 주입)
config:
  configMapName: univ-us-be-config   # 비밀 아닌 설정(프로필·Redis 호스트·업로드 경로 등)
  secretName: univ-us-be-secret      # 비밀(DB 비번·JWT 시크릿·외부 API 키 등)

# 업로드 파일 영속 저장(PVC) — 파드 재시작에도 업로드 이미지가 안 사라지게
persistence:
  claimName: univ-us-be-uploads   # 미리 만들어 둔 PVC 이름(StorageClass: local-path)
  mountPath: /data/uploads        # 컨테이너 안에서 PVC 가 마운트되는 경로(= 앱의 FILE_UPLOAD_ROOT)
  # 영속 로그(파일 appender) — uploads 와 동일 local-path PVC 패턴(차트 밖 수동 선생성).
  # 앱은 application-prod.yml 의 logging.file.name=${LOG_PATH:/data/logs}/univ-us-be.log 로 이 경로에 기록.
  logs:
    claimName: univ-us-be-logs    # 미리 만들어 둔 로그 PVC 이름(StorageClass: local-path, ns univus)
    mountPath: /data/logs         # 컨테이너 안에서 로그 PVC 가 마운트되는 경로(= LOG_PATH)
